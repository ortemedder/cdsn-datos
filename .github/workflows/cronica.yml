# Parte del día (IA): cada hora de 06 a 14 UTC (desde las 07:00–08:00 de España, en invierno y en verano).
# Con «envio» F envía a la hora fija de «enviar» (08:00) y espera en el mismo trabajo a que llegue el parte.
# El script decide si toca enviar el lote o recoger el parte (cronica_config.json). También a mano desde Actions.
name: cronica
on:
  schedule:
    - cron: "7 6-14 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "auto (normal), contar (mide tokens, gratis), forzar (envía ya), local (solo prepara datos)"
        default: "auto"
        type: choice
        options: [auto, contar, forzar, local]
permissions:
  contents: write
concurrency:
  group: cronica
jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Parte del día
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/cronica.py "${{ github.event.inputs.modo || 'auto' }}"
      - name: Subir
        run: |
          git config user.name "cdsn-cronica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cronica_ia.json cronica_estado.json cronica_medida.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -q -m "Parte del día $(date -u +%d/%m/%Y)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
