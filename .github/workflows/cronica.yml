# Parte del día (IA): cada hora de 06 a 14 UTC (desde las 07:00–08:00 de España, en invierno y en verano).
# Con «envio» F envía a la hora fija de «enviar» (08:00) y espera en el mismo trabajo a que llegue el parte.
# El script decide si toca enviar el lote o recoger el parte (cronica_config.json). También a mano desde Actions.
# 27/11/2026: GitHub nunca ha lanzado el reloj (schedule) en este repositorio, así que también se lanza
# cada vez que el escucha sube faccion.json (cada 15 min); si el parte de hoy ya está, termina en segundos.
name: cronica
on:
  push:
    branches: [main]
    paths: [faccion.json]
  schedule:
    - cron: "7 6-14 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "auto (normal), contar (mide tokens, gratis), forzar (envía ya), especial (SITREP ESPECIAL del almirante), local (solo prepara datos)"
        default: "auto"
        type: choice
        options: [auto, contar, forzar, especial, local]
      cuenta:
        description: "Solo especial: ¿cuenta como parte normal? (si = ocupa el sitio del siguiente; no = el PM sale igual)"
        default: "no"
        type: choice
        options: ["no", "si"]
      nota:
        description: "Solo especial: indicación para la IA (opcional)"
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: cronica
jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Mirar si hace falta
        id: mira
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, zoneinfo
          hoy = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Madrid")).strftime("%Y-%m-%d")
          try: e = json.load(open("cronica_estado.json")) or {}
          except Exception: e = {}
          import time   # c1.2: un parte por tick: solo se salta si hubo parte hace menos de 8 h (el script decide el resto)
          # c1.3: la regla de 8 h cuenta desde el último parte normal (AM/PM), no desde un FLASH
          hecho = bool(e.get("recogido")) and time.time() - (e.get("ult_normal") or e.get("enviado") or 0) < 8 * 3600
          print("saltar=" + ("si" if hecho and "${{ github.event_name }}" != "workflow_dispatch" else "no"))
          PY
      - name: Parte del día
        if: steps.mira.outputs.saltar != 'si'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRONICA_CUENTA: ${{ github.event.inputs.cuenta }}
          CRONICA_NOTA: ${{ github.event.inputs.nota }}
        run: python3 tools/cronica.py "${{ github.event.inputs.modo || 'auto' }}"
      - name: Subir
        if: steps.mira.outputs.saltar != 'si'
        run: |
          git config user.name "cdsn-cronica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cronica_ia.json cronica_estado.json cronica_medida.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -q -m "Parte del día $(date -u +%d/%m/%Y)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
